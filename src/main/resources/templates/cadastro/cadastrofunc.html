<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDAE — Cadastro de Funcionário</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sdae-base.css}">
    <style>
        
        html{font-size:18px;}
        body{background:#F4F6FA;color:#1A202C;font-family:var(--font-sans);min-height:100vh;background-image:radial-gradient(ellipse 80% 40% at 50% -5%,rgba(255,255,255,.1) 0%,transparent 55%),linear-gradient(#E8EDF5 1px,transparent 1px),linear-gradient(90deg,#E8EDF5 1px,transparent 1px);background-size:100% 100%,48px 48px,48px 48px;}

        

        @keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(0,200,151,.5)}50%{box-shadow:0 0 0 5px rgba(0,200,151,0)}}
        
        main{padding:24px 28px 40px;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:24px;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .page-header{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid #E8EDF5;}
        .page-title{font-family:var(--font-serif);font-size:31px;font-weight:700;color:#0A0E1A;}.page-sub{font-family:var(--font-mono);font-size:12px;letter-spacing:2px;color:#4A5568;text-transform:uppercase;margin-top:4px;}
        .form-card{background:#fff;border:1px solid #E8EDF5;border-radius:var(--r-md);overflow:hidden;animation:fadeUp .5s ease both;}
        .card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;border-bottom:1px solid #E8EDF5;}
        .card-title{font-family:var(--font-serif);font-size:19px;font-weight:600;color:#0A0E1A;}.card-sub{font-family:var(--font-mono);font-size:12px;color:#4A5568;letter-spacing:1px;text-transform:uppercase;}
        .card-body{padding:24px;}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}.form-group{display:flex;flex-direction:column;gap:6px;}.form-group.full{grid-column:1/-1;}
        .form-label{font-family:var(--font-mono);font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:#374151;font-weight:600;}.form-label span{color:var(--ruby);margin-left:2px;}
        .form-input,.form-select{background:#F4F6FA;border:1px solid #D1DCF0;border-radius:var(--r-sm);padding:10px 14px;color:#0A0E1A;font-family:var(--font-sans);font-size:16px;outline:none;width:100%;transition:border-color .18s;}
        .form-input:focus,.form-select:focus{border-color:rgba(37,99,235,.35);box-shadow:0 0 0 3px rgba(33,150,243,.1);}
        .form-select{appearance:none;cursor:pointer;}
        .form-actions{padding:16px 20px;border-top:1px solid #E2E6EE;display:flex;justify-content:flex-end;gap:10px;}
        .btn{font-family:var(--font-sans);font-size:15px;font-weight:600;padding:9px 20px;border-radius:var(--r-sm);border:none;cursor:pointer;transition:all .18s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
        .btn-blue{background:var(--blue-500);color:#fff;}.btn-blue:hover{background:var(--blue-400);}
        .btn-ghost{background:#fff;color:#4A5568;border:1px solid #D1DCF0;}.btn-ghost:hover{border-color:rgba(37,99,235,.35);}
        .success-msg{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:var(--r-sm);padding:12px 18px;color:#065F46;font-size:15px;}
        footer{border-top:1px solid #E2E6EE;padding:12px 0;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:#64748B;}

        /* ── RESPONSIVO (Melhoria 3) ── */
        @media (max-width: 700px){
            main{padding:16px;}
            .form-grid{grid-template-columns:1fr;}
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: header(paginaAtiva='admin')}"></header>
<main>
    <div class="page-header">
        <div><div class="page-title">Cadastrar Funcionário</div><div class="page-sub">Registre um novo colaborador</div></div>
        <a href="/admin" class="btn btn-ghost">← Voltar</a>
    </div>
    <div th:if="${param.sucesso}" class="success-msg">✓ Funcionário cadastrado com sucesso! <a href="/admin" style="color:#065F46;font-weight:600;margin-left:6px;">Ver lista →</a></div>
    <div th:if="${param.erro}" style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:4px;padding:12px 18px;color:#991B1B;font-size:15px;margin-bottom:16px;">⚠ Erro ao cadastrar. Verifique se o e-mail ou matrícula já estão cadastrados.</div>
    <div class="form-card">
        <div class="card-head"><div><div class="card-title">Dados do Funcionário</div><div class="card-sub">Informações pessoais e acesso</div></div></div>
        <form th:action="@{/admin/salvar}" th:object="${funcionario}" method="post">
            <th:block th:replace="~{fragments/csrf :: token}"/>
            <div class="card-body"><div class="form-grid">
                <div class="form-group"><label class="form-label">Nome <span>*</span></label><input type="text" class="form-input" th:field="*{nome}" placeholder="Nome completo" required></div>
                <div class="form-group"><label class="form-label">Matrícula</label><input type="text" class="form-input" th:field="*{matricula}" placeholder="Ex: OP001" style="text-transform:uppercase;"></div>
                <div class="form-group"><label class="form-label">CPF</label><input type="text" class="form-input" th:field="*{cpf}" placeholder="000.000.000-00"></div>
                <div class="form-group"><label class="form-label">E-mail</label><input type="email" class="form-input" th:field="*{email}" placeholder="email@sdae.com.br"></div>
                <div class="form-group"><label class="form-label">Telefone</label><input type="text" class="form-input" th:field="*{telefone}" placeholder="(11) 99999-0000"></div>
                <div class="form-group"><label class="form-label">Departamento</label><input type="text" class="form-input" th:field="*{departamento}" placeholder="Ex: Manutenção, TI, Operações"></div>
                <div class="form-group"><label class="form-label">Cargo <span>*</span></label>
                    <select class="form-select" th:field="*{cargo}" required><option value="">Selecione...</option><option value="OPERADOR">Operador</option><option value="ENGENHEIRO">Engenheiro</option><option value="ADMINISTRADOR">Administrador</option></select></div>
                <div class="form-group"><label class="form-label">Turno <span>*</span></label>
                    <select class="form-select" th:field="*{turno}" required><option value="">Selecione...</option><option value="MANHA">Manhã</option><option value="TARDE">Tarde</option><option value="NOITE">Noite</option></select></div>
                <div class="form-group"><label class="form-label">Nível de Acesso <span>*</span></label>
                    <select class="form-select" th:field="*{nivelAcesso}" required><option value="">Selecione...</option><option value="OPERADOR">Operador</option><option value="ENGENHEIRO">Engenheiro</option><option value="TECNICO">Técnico</option><option value="ADMINISTRADOR">Administrador</option></select></div>
                <div class="form-group full"><label class="form-label">Senha <span>*</span></label><input type="password" class="form-input" th:field="*{senha}" placeholder="Senha de acesso" required></div>
            </div></div>
            <div class="form-actions"><a href="/admin" class="btn btn-ghost">Cancelar</a><button type="submit" class="btn btn-blue">✔ Cadastrar</button></div>
        </form>
    </div>
    <footer><span>SDAE | Cadastro de Funcionário</span><span id="fdate">—</span></footer>
</main>
<script>
    setInterval(()=>{const d=new Date();document.getElementById('clk').textContent=d.toLocaleTimeString('pt-BR');},1000);
    (()=>{const d=new Date();const el=document.getElementById('fdate');if(el)el.textContent=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});})();
</script>
<th:block th:replace="~{fragments/sdae-scripts :: bundle(null)}"></th:block>
<script th:src="@{/js/sdae-forms.js}"></script>
</body>
</html>
