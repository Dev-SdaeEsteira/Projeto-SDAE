<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDAE — Editar Esteira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sdae-base.css}">
    <style>

        html{font-size:18px;}
        body{background:#F4F6FA;color:#1A202C;font-family:var(--font-sans);min-height:100vh;overflow-x:hidden;
          background-image:radial-gradient(ellipse 80% 40% at 50% -5%,rgba(255,255,255,0.1) 0%,transparent 55%),
          linear-gradient(#E8EDF5 1px,transparent 1px),linear-gradient(90deg,#E8EDF5 1px,transparent 1px);
          background-size:100% 100%,48px 48px,48px 48px;}

        

        

        

        
        @keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(0,200,151,.5);}50%{box-shadow:0 0 0 5px rgba(0,200,151,0);}}

        main{padding:24px 28px 40px;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:24px;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .page-header{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid #E8EDF5;}
        .page-title{font-family:var(--font-serif);font-size:31.2px;font-weight:700;color:#0A0E1A;}
        .page-sub{font-family:var(--font-mono);font-size:12px;letter-spacing:2px;color:#4A5568;text-transform:uppercase;margin-top:4px;}

        .form-card{background:white;border:1px solid #E8EDF5;border-radius:var(--r-md);overflow:hidden;animation:fadeUp .5s ease both;}
        .card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;border-bottom:1px solid #E8EDF5;}
        .card-title{font-family:var(--font-serif);font-size:19.2px;font-weight:600;color:#0A0E1A;}
        .card-sub{font-family:var(--font-mono);font-size:12.6px;color:#4A5568;letter-spacing:1px;text-transform:uppercase;font-weight:500;}
        .card-body{padding:24px;}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
        .form-group{display:flex;flex-direction:column;gap:6px;}
        .form-group.full{grid-column:1/-1;}
        .form-label{font-family:var(--font-mono);font-size:13.2px;letter-spacing:.8px;text-transform:uppercase;color:#374151;font-weight:600;}
        .form-label span{color:var(--ruby);margin-left:2px;}
        .form-input{background:#F4F6FA;border:1px solid #D1DCF0;border-radius:var(--r-sm);padding:10px 14px;color:#0A0E1A;font-family:var(--font-sans);font-size:16.8px;transition:border-color .18s,box-shadow .18s;outline:none;width:100%;}
        .form-input:focus{border-color:rgba(37,99,235,.35);box-shadow:0 0 0 3px rgba(33,150,243,.1);}
        .toggle-wrap{display:flex;align-items:center;gap:12px;cursor:pointer;padding:6px 0;}
        .toggle-wrap input[type="checkbox"]{width:18px;height:18px;accent-color:var(--blue-500);}
        .toggle-label{font-size:15px;color:#1A202C;}
        .form-actions{padding:16px 20px;border-top:1px solid #E2E6EE;display:flex;justify-content:flex-end;gap:10px;background:rgba(248,250,252,.92);}
        .btn{font-family:var(--font-sans);font-size:15.6px;font-weight:600;padding:9px 20px;border-radius:var(--r-sm);border:none;cursor:pointer;transition:all .18s;letter-spacing:.3px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
        .btn:active{transform:scale(.97);}
        .btn-blue{background:var(--blue-500);color:#fff;}
        .btn-blue:hover{background:var(--blue-400);box-shadow:0 0 14px rgba(33,150,243,.35);}
        .btn-ghost{background:white;color:#4A5568;border:1px solid #D1DCF0;}
        .btn-ghost:hover{color:#1A202C;border-color:rgba(37,99,235,.35);}
        .info-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(37,99,235,.06);border:1px solid rgba(37,99,235,.2);border-radius:20px;padding:3px 12px;font-family:var(--font-mono);font-size:12px;color:var(--blue-300);letter-spacing:1px;}

        footer{border-top:1px solid #E2E6EE;padding:12px 0 0;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11.4px;color:#64748B;letter-spacing:.8px;}

        /* ── RESPONSIVO (Melhoria 3) ── */
        @media (max-width: 700px){
            main{padding:16px;}
            .form-grid{grid-template-columns:1fr;}
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/header :: header(paginaAtiva='esteiras')}"></header>

<main>
    <div class="page-header">
        <div>
            <div class="page-title">Editar Esteira</div>
            <div class="page-sub">Altere os dados da esteira selecionada</div>
        </div>
        <a href="/esteiras" class="btn btn-ghost">← Voltar</a>
    </div>

    <div th:if="${param.erro}" style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:var(--r-sm);padding:12px 18px;color:#991B1B;font-size:15px;">⚠ Erro ao atualizar a esteira. Tente novamente.</div>

    <div class="form-card">
        <div class="card-head">
            <div>
                <div class="card-title">Dados da Esteira</div>
                <div class="card-sub">Identificação e localização</div>
            </div>
            <span class="info-badge" th:text="'ID #' + ${esteira.id}">ID #1</span>
        </div>

        <form th:action="@{/esteiras/salvar}" th:object="${esteira}" method="post">
            <th:block th:replace="~{fragments/csrf :: token}"/>
            <input type="hidden" th:field="*{id}"/>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="nome">Nome da Esteira <span>*</span></label>
                        <input type="text" class="form-input" id="nome" th:field="*{nome}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="localizacao">Localização / Setor <span>*</span></label>
                        <input type="text" class="form-input" id="localizacao" th:field="*{localizacao}" required>
                    </div>
                    <div class="form-group full">
                        <label class="toggle-wrap">
                            <input type="checkbox" th:field="*{ativa}">
                            <span class="toggle-label">Esteira ativa (em operação)</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <a href="/esteiras" class="btn btn-ghost">Cancelar</a>
                <button type="submit" class="btn btn-blue">✔ Salvar Alterações</button>
            </div>
        </form>
    </div>

    <footer>
        <span>SDAE&nbsp;|&nbsp; Editar Esteira</span>
        <span id="fdate">—</span>
    </footer>
</main>

<script>
setInterval(()=>{const d=new Date();document.getElementById('clk').textContent=d.toLocaleTimeString('pt-BR');},1000);
(()=>{const d=new Date();const el=document.getElementById('fdate');if(el)el.textContent=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});})();
</script>
<th:block th:replace="~{fragments/sdae-scripts :: bundle(null)}"></th:block>
<script th:src="@{/js/sdae-forms.js}"></script>
</body>
</html>
