<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDAE — Meu Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sdae-base.css}">
    <style>
        html{font-size:18px;}
        body{background:#F4F6FA;color:#1A202C;font-family:var(--font-sans);min-height:100vh;background-image:linear-gradient(#E8EDF5 1px,transparent 1px),linear-gradient(90deg,#E8EDF5 1px,transparent 1px);background-size:48px 48px;}
        main{padding:24px 28px 40px;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:24px;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .page-header{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid #E8EDF5;}
        .page-title{font-family:var(--font-serif);font-size:31px;font-weight:700;color:#0A0E1A;}.page-sub{font-family:var(--font-mono);font-size:12px;letter-spacing:2px;color:#4A5568;text-transform:uppercase;margin-top:4px;}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
        .form-card{background:#fff;border:1px solid #E8EDF5;border-radius:var(--r-md);overflow:hidden;animation:fadeUp .5s ease both;}
        .card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;border-bottom:1px solid #E8EDF5;}
        .card-title{font-family:var(--font-serif);font-size:19px;font-weight:600;color:#0A0E1A;}.card-sub{font-family:var(--font-mono);font-size:12px;color:#4A5568;letter-spacing:1px;text-transform:uppercase;}
        .card-body{padding:24px;}.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
        .form-label{font-family:var(--font-mono);font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:#374151;font-weight:600;}.form-label span{color:var(--ruby);margin-left:2px;}
        .form-input,.form-select{background:#F4F6FA;border:1px solid #D1DCF0;border-radius:var(--r-sm);padding:10px 14px;color:#0A0E1A;font-family:var(--font-sans);font-size:16px;outline:none;width:100%;transition:border-color .18s;}
        .form-input:focus,.form-select:focus{border-color:rgba(37,99,235,.35);box-shadow:0 0 0 3px rgba(33,150,243,.1);}
        .form-input:disabled{background:#F9F9F9;color:#4A5568;cursor:not-allowed;}
        .form-select{appearance:none;cursor:pointer;}
        .form-actions{padding:16px 20px;border-top:1px solid #E2E6EE;display:flex;justify-content:flex-end;gap:10px;}
        .btn{font-family:var(--font-sans);font-size:15px;font-weight:600;padding:9px 20px;border-radius:var(--r-sm);border:none;cursor:pointer;transition:all .18s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
        .btn-blue{background:var(--blue-500);color:#fff;}.btn-blue:hover{background:var(--blue-400);}
        .btn-ghost{background:#fff;color:#4A5568;border:1px solid #D1DCF0;}.btn-ghost:hover{border-color:rgba(37,99,235,.35);}
        .info-box{background:rgba(37,99,235,.05);border:1px solid rgba(37,99,235,.15);border-radius:var(--r-sm);padding:16px;margin-bottom:16px;}
        .info-box strong{color:var(--blue-600);}
        .success-msg{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:var(--r-sm);padding:12px 18px;color:#065F46;font-size:15px;margin-bottom:16px;}
        .error-msg{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:var(--r-sm);padding:12px 18px;color:#991B1B;font-size:15px;margin-bottom:16px;}
        footer{border-top:1px solid #E2E6EE;padding:12px 0;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:#64748B;}
        @media (max-width: 700px){
            main{padding:16px;}
            .grid-2{grid-template-columns:1fr;}
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: header(paginaAtiva='perfil')}"></header>
<main>
    <div class="page-header">
        <div><div class="page-title">Meu Perfil</div><div class="page-sub">Informações pessoais e segurança</div></div>
        <a href="/dashboard" class="btn btn-ghost">← Voltar</a>
    </div>

    <div th:if="${param.sucesso}" class="success-msg">✓ Perfil atualizado com sucesso!</div>
    <div th:if="${param.erro}" class="error-msg">⚠ Erro ao atualizar. Tente novamente.</div>

    <div class="grid-2">
        <!-- Card 1: Dados Pessoais (Readonly) -->
        <div class="form-card">
            <div class="card-head"><div><div class="card-title">Dados Pessoais</div><div class="card-sub">Informações gerais</div></div></div>
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-input" th:value="${funcionario.nome}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-input" th:value="${funcionario.email}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Matrícula</label>
                    <input type="text" class="form-input" th:value="${funcionario.matricula}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Cargo</label>
                    <input type="text" class="form-input" th:value="${funcionario.cargo}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Nível de Acesso</label>
                    <input type="text" class="form-input" th:value="${funcionario.nivelAcesso}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Turno</label>
                    <input type="text" class="form-input" th:value="${funcionario.turno}" disabled>
                </div>
            </div>
        </div>

        <!-- Card 2: Trocar Senha -->
        <div class="form-card">
            <div class="card-head"><div><div class="card-title">Segurança</div><div class="card-sub">Alterar senha</div></div></div>
            <div class="card-body">
                <div class="info-box">
                    <strong>Proteja sua conta</strong> com uma senha forte contendo letras, números e caracteres especiais.
                </div>
                <form th:action="@{/perfil/salvar}" method="post">
                    <th:block th:replace="~{fragments/csrf :: token}"/>
                    <input type="hidden" th:value="${funcionario.id}" name="id">

                    <div class="form-group">
                        <label class="form-label">Senha Atual <span>*</span></label>
                        <input type="password" class="form-input" name="senhaAtual" placeholder="Digite sua senha atual" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Nova Senha <span>*</span></label>
                        <input type="password" class="form-input" id="novaSenha" name="novaSenha" placeholder="Digite uma nova senha" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirmar Nova Senha <span>*</span></label>
                        <input type="password" class="form-input" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme a nova senha" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-blue">✔ Alterar Senha</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer><span>SDAE | Meu Perfil</span><span id="fdate">—</span></footer>
</main>

<script>
    setInterval(()=>{const d=new Date();document.getElementById('clk').textContent=d.toLocaleTimeString('pt-BR');},1000);
    (()=>{const d=new Date();const el=document.getElementById('fdate');if(el)el.textContent=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});})();

    // Validar se as senhas coincidem
    document.querySelector('form')?.addEventListener('submit', (e) => {
        const nova = document.getElementById('novaSenha').value;
        const confirmar = document.getElementById('confirmarSenha').value;
        if (nova !== confirmar) {
            e.preventDefault();
            alert('As senhas não coincidem. Tente novamente.');
            return false;
        }
        if (nova.length < 6) {
            e.preventDefault();
            alert('A senha deve ter no mínimo 6 caracteres.');
            return false;
        }
    });
</script>
</body>
</html>
